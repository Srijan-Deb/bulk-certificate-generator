services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cert_generator_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - RUN_WORKER_IN_APP=false
      - DATABASE_URL=sqlite:////app/storage/data.db
      - STORAGE_DIR=/app/storage/certificates
      - WORKER_POLL_INTERVAL_SECONDS=2.0
    volumes:
      - cert_data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cert_generator_worker
    restart: unless-stopped
    command: ["python", "worker_runner.py"]
    environment:
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=sqlite:////app/storage/data.db
      - STORAGE_DIR=/app/storage/certificates
      - WORKER_POLL_INTERVAL_SECONDS=2.0
    volumes:
      - cert_data:/app/storage
    depends_on:
      - api

volumes:
  cert_data:
    driver: local

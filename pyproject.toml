[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-certificate-generator"
version = "1.0.0"
description = "Zero-Cost Bulk Certificate Generator Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.0.0",
    "reportlab>=4.2.0",
    "pillow>=10.4.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0"
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["B008", "TRY401", "BLE001", "E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning"
]

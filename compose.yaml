services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cert_generator_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - RUN_WORKER_IN_APP=false
      - DATABASE_URL=sqlite:////app/storage/data.db
      - STORAGE_DIR=/app/storage/certificates
      - WORKER_POLL_INTERVAL_SECONDS=2.0
    volumes:
      - cert_data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cert_generator_worker
    restart: unless-stopped
    command: ["python", "worker_runner.py"]
    environment:
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=sqlite:////app/storage/data.db
      - STORAGE_DIR=/app/storage/certificates
      - WORKER_POLL_INTERVAL_SECONDS=2.0
    volumes:
      - cert_data:/app/storage
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cert_generator_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.3
    container_name: cert_generator_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus

volumes:
  cert_data:
    driver: local
  grafana_data:
    driver: local
